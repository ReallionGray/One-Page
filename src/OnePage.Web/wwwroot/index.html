<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OnePage — Operations Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <link href="/styles.css?v=15" rel="stylesheet" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>
  <div id="app" class="container-fluid px-3 px-lg-4 app-shell">
    <div class="boot-loader">
      <div class="boot-logo"></div>
      <div class="boot-text">Loading OnePage…</div>
    </div>
  </div>
  <noscript>
    <div class="container alert alert-warning mt-3">JavaScript is required. Open the <a href="http://localhost:5001/swagger">API Swagger</a> instead.</div>
  </noscript>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    (function () {
      try {
        var host = window.location.hostname || 'localhost';
        window.__ONEPAGE_API_BASE__ = window.__ONEPAGE_API_BASE__ || (window.location.protocol + '//' + host + ':5001/api/v1');
      } catch (e) { window.__ONEPAGE_API_BASE__ = '/api/v1'; }
    })();
  </script>
  <script src="/app.js?v=20"></script>
  <script src="/js/components/leave-management.js"></script>
  <script src="/js/components/performance-management.js"></script>
  <script src="/js/components/recruitment.js"></script>
  <script src="/js/components/time-attendance.js"></script>
  <script src="/js/components/disciplinary.js"></script>
  <script src="/js/components/onboarding.js"></script>
  <script src="/js/components/employee-documents.js"></script>
</body>
